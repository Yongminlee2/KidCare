name: KidCare

options:
  bundleIdPrefix: com.kidcare
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

# 타깃마다 적으면 언젠가 한 타깃이 빠지고 그 타깃만 XcodeGen 기본값(Swift 5)으로
# 조용히 떨어진다 — 이 앱의 테스트는 actor 와 Firestore 리스너를 다룬다.
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Info.plist 의 CFBundleDevelopmentRegion 이 이 값을 그대로 읽는다
    # ($(DEVELOPMENT_LANGUAGE) — Info.plist 자체 확인). 지금은 Localizable.xcstrings
    # 에 ko 하나뿐이라 안 적어도 "언어가 하나뿐이면 그게 기준"이라는 폴백으로
    # 우연히 맞는다. Phase 6 이 진짜 en.lproj 를 추가하는 순간 그 폴백이 사라지고
    # 기준 언어가 조용히 en 으로 뒤집힌다 — 지금 명시해서 그 사고를 막는다.
    DEVELOPMENT_LANGUAGE: ko

packages:
  # 떠 있는 from: 12.0.0 이면 새로 클론한 사람은 그날 나온 최신 12.x 를 받는다.
  # FirebaseBootstrap.swift 의 에뮬레이터 전환(isSSLEnabled 를 직접 꺼야 하는 것,
  # useEmulator 가 host 만 바꾸는 것)은 Firebase iOS SDK 12.19.x 소스를 읽고 확인한
  # 동작이다 — 13.x 로 조용히 올라가면 그 확인이 더 이상 맞다는 보장이 없고, 깨지는
  # 방식이 "에뮬레이터로 TLS 핸드셰이크를 시도하다 조용히 재시도만 반복"이라 원인을
  # 찾는 데 20분이 그대로 걸렸다(실제로 겪은 일). NMapsMap 처럼 정확한 버전을 못
  # 박는다 — Package.resolved(이 파일은 .xcodeproj 안에 있어 gitignore 로 커밋되지
  # 않는다)에 실제로 잡혀 있던 값 그대로다.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.1
  # 안드로이드가 쓰는 버전과 정확히 같은 값이다(gradle/libs.versions.toml 의 naverMap).
  # 버전이 갈리면 타일과 좌표계 차이로 두 폰이 같은 자리를 다르게 그리는 날이 온다.
  NMapsMap:
    url: https://github.com/navermaps/SPM-NMapsMap
    exactVersion: 3.23.3

targets:
  KidCare:
    type: application
    platform: iOS
    sources:
      - path: KidCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kidcare.family
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        # AppIcon.appiconset 안의 단일 1024 항목에서 나머지 크기를 iOS 17+ 가
        # 알아서 만든다(Assets.xcassets 는 위 KidCare 소스 경로에 포함되어 함께 실린다).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: KidCare/Info.plist
      properties:
        CFBundleDisplayName: 우리아이 지킴이
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 네이버 SDK 가 이 이름 그대로 읽는다. 값은 Base.xcconfig → Secrets.xcconfig 에서 온다.
        NMFNcpKeyId: $(NAVER_MAP_NCP_KEY_ID)
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: NMapsMap
        product: NMapsMap

  KidCareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Swift 소스 글롭만으로는 golden/*.json 이 번들에 안 실린다 — 별도 리소스 빌드
      # 페이즈로 명시해야 GoldenComparisonTests 가 런타임에 그 파일을 찾을 수 있다.
      - path: KidCareTests
        excludes:
          - "golden/**"
      # type: folder 로 "폴더 참조"(파란 폴더)를 만든다 — 그래야 번들 안에서도
      # golden/ 하위 디렉터리 구조가 그대로 유지된다. 기본값(그룹)으로 두면 파일들이
      # 낱개로 번들 최상위에 펼쳐져 실려, Bundle.url(forResource:subdirectory:"golden")
      # 가 못 찾는다.
      - path: KidCareTests/golden
        type: folder
        buildPhase: resources
    settings:
      base:
        # 테스트 타깃용 Info.plist 파일을 따로 두지 않는다. XcodeGen 2.46.0 은
        # info.path 가 없어도 이 값을 자동으로 YES 로 채우지 않아, 이 줄이 없으면
        # 코드 서명 단계에서 "Info.plist 가 없다"는 에러로 빌드가 멈춘다.
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: KidCare

  # 실기기 전용 자동화. 기본 KidCare 스킴의 test 액션에 **넣지 않는다** —
  # 시뮬레이터에서 돌 이유가 없고, 운영 Firebase 를 건드리므로 사람이 의도해서
  # 별도 스킴으로 돌려야 한다.
  KidCareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KidCareUITests
    settings:
      base:
        # 테스트 번들은 Info.plist 를 커밋하지 않고 빌드할 때 만들게 둔다
        # (KidCareTests 와 같은 이유).
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: KidCare

schemes:
  KidCare:
    build:
      targets:
        KidCare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KidCareTests

  # 실기기에서 사람 대신 화면을 눌러보는 스킴.
  KidCareUITests:
    build:
      targets:
        KidCare: all
        KidCareUITests: [test]
    test:
      config: Debug
      targets:
        - KidCareUITests
